# DataMap-Lite Docker Compose Configuration
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs
#   docker-compose build          # Rebuild images

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: ${DATAMAP_POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    container_name: datamap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-datamap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datamap123}
      POSTGRES_DB: ${DB_NAME:-datamap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-datamap} -d ${DB_NAME:-datamap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datamap-network

  # Backend API + Embedded Frontend Server
  backend:
    image: ${DATAMAP_BACKEND_IMAGE:-datamap-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${DATAMAP_NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        GO_IMAGE: ${DATAMAP_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.25.4-alpine}
        RUNTIME_IMAGE: ${DATAMAP_RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
        PNPM_VERSION: ${DATAMAP_PNPM_VERSION:-10.28.0}
        NPM_REGISTRY: ${DATAMAP_NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${DATAMAP_GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${DATAMAP_GOSUMDB:-sum.golang.google.cn}
    container_name: datamap-backend
    restart: unless-stopped
    environment:
      # Database
      DATAMAP_DATABASE_TYPE: postgres
      DATAMAP_DATABASE_HOST: postgres
      DATAMAP_DATABASE_PORT: 5432
      DATAMAP_DATABASE_DATABASE: ${DB_NAME:-datamap}
      DATAMAP_DATABASE_USERNAME: ${DB_USER:-datamap}
      DATAMAP_DATABASE_PASSWORD: ${DB_PASSWORD:-datamap123}
      # Server
      DATAMAP_SERVER_HOST: 0.0.0.0
      DATAMAP_SERVER_PORT: 8080
      # Security
      DATAMAP_AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATAMAP_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32bytes}
      # Log
      DATAMAP_LOG_LEVEL: ${LOG_LEVEL:-info}
      DATAMAP_LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - datamap-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: ${DATAMAP_PGADMIN_IMAGE:-docker.m.daocloud.io/dpage/pgadmin4:latest}
    container_name: datamap-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@datamap.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - datamap-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  datamap-network:
    driver: bridge
