<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataMap-Lite</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      main {
        max-width: 720px;
        margin: 10vh auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 28px;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #e5eef9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>前端资源尚未嵌入</h1>
      <p>当前后端已启用静态资源托管，但没有找到可嵌入的前端构建产物。</p>
      <p>
        请先执行 <code>pnpm --dir web build</code>，再执行
        <code>go run ./cmd/embedassets</code> 后重新构建后端。
      </p>
    </main>
  </body>
</html>
