# DataMap-Lite Configuration
#
# This file is OPTIONAL. All settings can be configured via environment variables.
# Environment variable format: DATAMAP_<SECTION>_<KEY>
# Example: DATAMAP_SERVER_PORT=9000
#
# For production, use environment variables instead of this file.

server:
  host: "0.0.0.0"              # DATAMAP_SERVER_HOST
  port: 8080                   # DATAMAP_SERVER_PORT
  read_timeout: 30s            # DATAMAP_SERVER_READ_TIMEOUT
  write_timeout: 30s           # DATAMAP_SERVER_WRITE_TIMEOUT
  shutdown_timeout: 10s        # DATAMAP_SERVER_SHUTDOWN_TIMEOUT

database:
  type: "sqlite"               # DATAMAP_DATABASE_TYPE (sqlite or postgres)

  # SQLite configuration (when type=sqlite)
  sqlite_path: "./data/datamap.db"  # DATAMAP_DATABASE_SQLITE_PATH
  sqlite_max_conns: 25               # DATAMAP_DATABASE_SQLITE_MAX_CONNS
  sqlite_min_conns: 5                # DATAMAP_DATABASE_SQLITE_MIN_CONNS

  # PostgreSQL configuration (when type=postgres)
  host: "localhost"            # DATAMAP_DATABASE_HOST
  port: 5432                   # DATAMAP_DATABASE_PORT
  database: "datamap"          # DATAMAP_DATABASE_DATABASE
  username: "datamap"          # DATAMAP_DATABASE_USERNAME
  password: "datamap"          # DATAMAP_DATABASE_PASSWORD
  ssl_mode: "disable"          # DATAMAP_DATABASE_SSL_MODE
  max_conns: 25                # DATAMAP_DATABASE_MAX_CONNS
  min_conns: 5                 # DATAMAP_DATABASE_MIN_CONNS
  max_conn_lifetime: 1h        # DATAMAP_DATABASE_MAX_CONN_LIFETIME
  max_conn_idle_time: 30m      # DATAMAP_DATABASE_MAX_CONN_IDLE_TIME

log:
  level: "info"                # DATAMAP_LOG_LEVEL (debug, info, warn, error)
  format: "console"            # DATAMAP_LOG_FORMAT (console, json)
  output: "stdout"             # DATAMAP_LOG_OUTPUT (stdout, stderr, or file path)

scanner:
  mongodb_sample_size: 1000    # DATAMAP_SCANNER_MONGODB_SAMPLE_SIZE
  max_lineage_depth: 10        # DATAMAP_SCANNER_MAX_LINEAGE_DEPTH

auth:
  enabled: true                # DATAMAP_AUTH_ENABLED
  jwt_secret: ""               # DATAMAP_AUTH_JWT_SECRET (REQUIRED - must be set via env var)
  access_token_ttl: 15m        # DATAMAP_AUTH_ACCESS_TOKEN_TTL
  refresh_token_ttl: 168h      # DATAMAP_AUTH_REFRESH_TOKEN_TTL (7 days)
  bcrypt_cost: 10              # DATAMAP_AUTH_BCRYPT_COST (4-31)

governance:
  enabled: false               # DATAMAP_GOVERNANCE_ENABLED
  endpoint: ""                 # DATAMAP_GOVERNANCE_ENDPOINT
  integration_token: ""        # DATAMAP_GOVERNANCE_INTEGRATION_TOKEN
  source_system: "fuckcmdb"    # DATAMAP_GOVERNANCE_SOURCE_SYSTEM
  timeout: 5s                  # DATAMAP_GOVERNANCE_TIMEOUT

