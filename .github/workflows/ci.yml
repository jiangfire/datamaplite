name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.google.cn"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  DATAMAP_NODE_IMAGE: "docker.m.daocloud.io/library/node:22-alpine"
  DATAMAP_GO_IMAGE: "docker.m.daocloud.io/library/golang:1.26.3-alpine"
  DATAMAP_RUNTIME_IMAGE: "docker.m.daocloud.io/library/alpine:3.20"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY="${GOPROXY}"
          go env -w GOSUMDB="${GOSUMDB}"

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Run tests
        env:
          DATAMAP_DATABASE_TYPE: sqlite
          DATAMAP_AUTH_JWT_SECRET: test-jwt-secret
          DATAMAP_ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
          MYSQL_TEST_DSN: root:root@tcp(localhost:3306)/test?parseTime=true
          MONGODB_TEST_URI: mongodb://localhost:27017/test
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        # v3 is deprecated on github.com (2025-01-30). Use v4 for GitHub.com; pin to v3 only if your self-hosted Gitea/GHES does not support v4.
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm config set registry "${NPM_CONFIG_REGISTRY}"

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --dir web lint

      - name: Run TypeScript check
        run: pnpm --dir web exec tsc --noEmit

      - name: Run tests
        run: pnpm --dir web test --if-present

      - name: Build frontend
        run: pnpm --dir web build

      - name: Upload build artifacts
        # v3 is deprecated on github.com (2025-01-30). Use v4 for GitHub.com; pin to v3 only if your self-hosted Gitea/GHES does not support v4.
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  embedded-build:
    name: Embedded Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download frontend dist
        # v3 is deprecated on github.com (2025-01-30). Use v4 for GitHub.com; pin to v3 only if your self-hosted Gitea/GHES does not support v4.
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY="${GOPROXY}"
          go env -w GOSUMDB="${GOSUMDB}"

      - name: Download dependencies
        run: go mod download

      - name: Verify embedded build compiles without CGO
        run: |
          go run ./cmd/embedassets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.Version=ci" -o /dev/null ./cmd/datamap

  docker-build:
    name: Docker Build Verification
    needs: [embedded-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: datamap:test
          build-args: |
            NODE_IMAGE=${{ env.DATAMAP_NODE_IMAGE }}
            GO_IMAGE=${{ env.DATAMAP_GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.DATAMAP_RUNTIME_IMAGE }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
            GOPROXY=${{ env.GOPROXY }}
            GOSUMDB=${{ env.GOSUMDB }}
