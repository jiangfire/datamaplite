name: Docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "latest"

env:
  REGISTRY: ${{ vars.OCI_REGISTRY != '' && vars.OCI_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.OCI_NAMESPACE != '' && vars.OCI_NAMESPACE || github.repository_owner }}
  IMAGE_NAME: datamap
  PNPM_VERSION: "10.28.0"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.google.cn"
  NPM_REGISTRY: "https://registry.npmmirror.com"
  DATAMAP_NODE_IMAGE: "docker.m.daocloud.io/library/node:22-alpine"
  DATAMAP_GO_IMAGE: "docker.m.daocloud.io/library/golang:1.26.3-alpine"
  DATAMAP_RUNTIME_IMAGE: "docker.m.daocloud.io/library/alpine:3.20"
  HAS_OCI_CREDS: ${{ secrets.OCI_USERNAME != '' && secrets.OCI_PASSWORD != '' }}

jobs:
  build:
    name: Build Datamap Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCI registry
        if: env.HAS_OCI_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAS_OCI_CREDS == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_IMAGE=${{ env.DATAMAP_NODE_IMAGE }}
            GO_IMAGE=${{ env.DATAMAP_GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.DATAMAP_RUNTIME_IMAGE }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            GOPROXY=${{ env.GOPROXY }}
            GOSUMDB=${{ env.GOSUMDB }}
