name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.google.cn"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"

jobs:
  build:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm config set registry "${NPM_CONFIG_REGISTRY}"

      - name: Build frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          go run ./cmd/embedassets

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY="${GOPROXY}"
          go env -w GOSUMDB="${GOSUMDB}"

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o dist/datamap-${{ matrix.suffix }} ./cmd/datamap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datamap-${{ matrix.suffix }}
          path: dist/datamap-${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          for file in *; do
            if [[ "$file" == *.exe ]]; then
              zip "${file%.exe}.zip" "$file"
            else
              tar czf "$file.tar.gz" "$file"
            fi
          done

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          ## What's Changed

          This release includes:
          - Cross-platform binaries for Linux (amd64, arm64), Windows (amd64), and macOS (amd64, arm64)
          - Pure Go SQLite support based on modernc.org/sqlite, so production builds no longer depend on CGO
          - CI/CD defaults tuned for mainland China mirrors (Go proxy, npm mirror, OCI registry)

          ## Installation

          Download the appropriate binary for your platform:
          - **Linux AMD64**: datamap-linux-amd64.tar.gz
          - **Linux ARM64**: datamap-linux-arm64.tar.gz
          - **Windows AMD64**: datamap-windows-amd64.zip
          - **macOS AMD64**: datamap-darwin-amd64.tar.gz
          - **macOS ARM64 (Apple Silicon)**: datamap-darwin-arm64.tar.gz

          ## Docker

          OCI image is published by the Docker workflow. By default it targets a mainland-friendly registry namespace configured through repository variables.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *beta* || "${{ github.ref_name }}" == *alpha* || "${{ github.ref_name }}" == *rc* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" release/*.tar.gz release/*.zip \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            ${prerelease_flag}
